<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light">
<title>Financial Tracker</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fintrack">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#DACDFB">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root{color-scheme:light;--ink:#1D1B2E;--mute:#6F6C86;--lav:#D8CFFA;--soft:#F1EEFD;--g:linear-gradient(90deg,#C4DBFF,#DACDFB,#FAD0E4);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{max-width:100%;overflow-x:hidden}
*{box-sizing:border-box}
body{margin:0;background:#FBFBFE radial-gradient(#D9D6EE 1px,transparent 1.3px) 0 0/22px 22px;color:var(--ink);font:400 14px/1.45 'Plus Jakarta Sans',system-ui,-apple-system,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
main{padding:14px 14px 96px;max-width:1100px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.4px}
.logo span{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;filter:saturate(1.6) brightness(.9)}
.chk{height:11px;border:2px solid var(--ink);border-radius:3px;margin:8px 0 16px;background:repeating-conic-gradient(#C4DBFF 0 25%,#fff 0 50%) 0 0/10px 10px}
h2{font-size:15px;font-weight:800;margin:20px 0 8px}h2:before{content:"\2726";color:#A58BF0;margin-right:7px}
.card{background:#fff;border:2px solid var(--ink);border-radius:5px;box-shadow:3px 3px 0 var(--lav);padding:14px 16px;margin-bottom:14px}
.mute,.tag{color:var(--mute);font-size:12.5px}
.grid{display:grid;gap:0 18px;grid-template-columns:minmax(0,1fr);align-items:start}.grid>div{min-width:0}
.hero{background:var(--g)}.hero .big{font-size:clamp(30px,10vw,42px);font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin:4px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed #CFCBE6}.row:first-of-type{border-top:0}
.pk b.d{display:inline-block;width:10px;height:10px;margin-right:8px;border:1.5px solid var(--ink)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:2px solid var(--ink);padding:5px 4px calc(5px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;padding:10px 2px;border-radius:5px;font-size:11.5px;font-weight:600;color:var(--mute)}
nav button.on{background:var(--g);color:var(--ink);font-weight:800}
.seg{display:flex;background:var(--soft);border-radius:5px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:4px;font-weight:600;color:var(--mute)}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(29,27,46,.2)}
.amt{display:flex;align-items:baseline;gap:8px;border-bottom:2px dashed var(--ink);margin:4px 0 12px;font-size:34px;font-weight:800;color:#8c88a3}
.amt input{border:0;background:none;font-size:34px;font-weight:800;padding:2px 0;width:100%;color:var(--ink);outline:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);background:#fff;padding:7px 12px;border-radius:5px;font-weight:600;font-size:13.5px}
.chip.on{background:var(--g);box-shadow:2px 2px 0 var(--ink)}
label{display:block;font-size:12.5px;color:var(--mute);font-weight:600;margin:12px 0 4px}
input,select{padding:9px 11px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;min-width:0;font-size:16px}
.w{width:100%}
.save{width:100%;border:2px solid var(--ink);background:var(--g);padding:14px;border-radius:5px;font-weight:800;font-size:15px;box-shadow:3px 3px 0 var(--ink)}
.btn{border:1.5px solid var(--ink);background:#fff;padding:6px 11px;border-radius:4px;font-size:12px;font-weight:600}
.cols{display:flex;gap:8px;align-items:center;margin-bottom:8px}.cols input:first-child,.cols select{flex:1}.cols .n{width:120px}.cols .p{width:64px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}td.k{white-space:normal}.sub{margin-top:1px}.mo{display:none}.pr{flex-wrap:wrap}.pr input:first-child{flex:1 1 100%}.pf{display:flex;gap:6px;flex:1 1 220px}.pf>div{flex:1;min-width:0}.pf input{width:100%}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid #E4E1F3;white-space:nowrap}
th{font-size:12px;color:var(--mute);font-weight:600;background:var(--soft);cursor:default}
th:first-child,td:first-child,.l{text-align:left}
tr.t td{font-weight:800;border-top:2px solid var(--ink)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.stats .card{margin:0;padding:10px 12px}.stats b{font-size:17px;display:block}
svg text{font:11px 'Plus Jakarta Sans',sans-serif;fill:#6F6C86}
.dn{display:flex;gap:18px;align-items:center}
.donut{width:120px;height:120px;border-radius:50%;position:relative;flex:none;border:2px solid var(--ink)}.donut:after{content:"";position:absolute;inset:30px;background:#fff;border-radius:50%;border:2px solid var(--ink)}
.bar{height:10px;background:var(--soft);border:1.5px solid var(--ink);border-radius:3px;overflow:hidden;flex:1}.bar i{display:block;height:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:9px 16px;border-radius:5px;z-index:30;font-weight:600}
.demo{font-size:12px;color:var(--mute);margin-top:18px}
@media(max-width:599px){.hc{display:none}.mo{display:block}.cols{flex-wrap:wrap}.cols input:first-child{flex:1 1 100%}.cols .n{width:auto;flex:1 1 90px}.stats b{font-size:15px}th,td{padding:6px 4px;font-size:12px}}
@media(min-width:900px){
nav{top:0;right:auto;width:190px;flex-direction:column;border-top:0;border-right:2px solid var(--ink);padding:26px 12px;gap:6px;justify-content:center}
nav button{text-align:left;padding:0 16px;height:52px;font-size:14px;flex:none}
main{margin-left:190px;max-width:none;padding:22px 36px 60px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toast{bottom:40px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<nav id="nav"></nav>
<main><div class="logo"><svg width="30" height="30" viewBox="0 0 30 30"><path d="M9 14C6 4 8 2 10 3s3 7 2 11M21 14c3-10 1-12-1-11s-3 7-2 11" fill="#fff" stroke="#1D1B2E" stroke-width="1.6"/><circle cx="15" cy="20" r="8" fill="#fff" stroke="#1D1B2E" stroke-width="1.6"/><circle cx="12" cy="19" r="1" fill="#1D1B2E"/><circle cx="18" cy="19" r="1" fill="#1D1B2E"/><path d="M13 23q2 1.6 4 0" fill="none" stroke="#1D1B2E" stroke-width="1.4" stroke-linecap="round"/></svg><span>Financial Tracker</span><button class="btn" id="sy" onclick="flush()" style="margin-left:auto;font-size:11px;padding:4px 8px"></button></div><div class="chk"></div><div id="app"></div></main>
<script>
var MON=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'],KEY='fintrack-proto-v2',S,F,view='home',iday,rm,ry,hm=-1,hy,hs='desc',delId=null,hl=50,ia=0;
var PAL=['#FFC4C4','#FFE49C','#BDE8D6','#BFD8FF','#D9CCFA','#F8C8E0','#FFD9B0','#CFE9F5'],TN={out:'Keluar',in:'Masuk',tf:'Transfer',sv:'Nabung'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function rp(n){n=Math.round(n);return(n<0?'-':'')+'Rp'+Math.abs(n).toLocaleString('id-ID')}
function nf(n){return Math.round(n).toLocaleString('id-ID')}
function kk(n){return n>=1e6?(n/1e6).toFixed(1).replace('.0','')+'jt':Math.round(n/1000)+'k'}
function MOB(){return!!(window.matchMedia&&matchMedia('(max-width:599px)').matches)}
function kd(n){var a=Math.abs(Math.round(n)),r=a>=1e6?(a/1e6).toFixed(2).replace(/\.?0+$/,'')+'jt':a>=1e3?Math.round(a/1e3)+'k':''+a;return(n<0?'-':'')+r}
function mc(n){return MOB()?kd(n):nf(n)}
function num(v){return+String(v).replace(/\D/g,'')||0}
function sum(a,f){return a.reduce(function(s,t){return s+f(t)},0)}
function ymd(t){var d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ds(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function inM(t,y,m){var d=new Date(t.t);return d.getFullYear()===y&&d.getMonth()===m}
function an(id){var a=S.accounts.filter(function(x){return x.id===id})[0];return a?a.name:'?'}
function pn(id){var p=S.pockets.filter(function(x){return x.id===id})[0];return p?p.name:'?'}
/* ===== koneksi ke Google Sheets (lewat Apps Script) ===== */
var API='https://script.google.com/macros/s/AKfycbwYyvd1uNyQjI67UhYG9xQxcwxAtyGJgHbl7uwNuGuTRyUwCyPS5d5pubZG27XC_6T7/exec',KC='ft-cache-v2',KQ='ft-queue-v2',KP='ft-pin',PIN='',Q=[],busy=false,loading=false;
function lsg(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lss(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function emptyS(){return{accounts:[],pockets:[],cats:[],incs:[],moods:[],payday:25,budget:0,tx:[]}}
function clone(o){return JSON.parse(JSON.stringify(o))}
function cfgOf(){return clone({accounts:S.accounts,pockets:S.pockets,cats:S.cats,incs:S.incs,moods:S.moods,payday:S.payday,budget:S.budget})}
function cache(){lss(KC,JSON.stringify(S))}
function q2(){lss(KQ,JSON.stringify(Q));ui()}
function enq(op){Q.push(op);q2();flush()}
function save(){cache();Q=Q.filter(function(x){return x.a!=='saveConfig'});Q.push({a:'saveConfig',config:cfgOf()});q2();flush()}
function saveAllOp(){cache();Q=[{a:'saveAll',config:cfgOf(),tx:clone(S.tx)}];q2();flush()}
function api(op){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({pin:PIN},op))}).then(function(r){return r.json()})}
function ui(){var b=document.getElementById('sy');if(!b)return;b.textContent=!Q.length?'Tersimpan di Sheets':busy?'Menyimpan...':'Belum tersinkron ('+Q.length+'), ketuk'}
async function flush(){
 if(busy||!Q.length||!PIN)return;busy=true;ui();
 try{while(Q.length){var r=await api(Q[0]);if(!r.ok){if(r.error==='PIN salah'){busy=false;return lock('PIN salah, coba lagi.')}throw new Error(r.error)}Q.shift();lss(KQ,JSON.stringify(Q))}}catch(e){}
 busy=false;ui()}
async function pull(){
 if(!PIN)return;
 try{var r=await api({a:'load'});
  if(!r.ok){if(r.error==='PIN salah')return lock('PIN salah, coba lagi.');throw new Error(r.error)}
  loading=false;
  if(!Q.length){var nd=Object.assign(emptyS(),r.data);if(JSON.stringify(nd)!==JSON.stringify(S)){S=nd;cache();if(!F||!F.acc)F=freshF()}}
  render()}
 catch(e){loading=false;render();toast('Gagal memuat, pakai data terakhir')}}
function start(){ui();flush().then(pull)}
function lock(msg){PIN='';lss(KP,'');document.getElementById('app').innerHTML='<div class="card" style="max-width:360px;margin:30px auto"><h2 style="margin-top:0">Masukkan PIN</h2><input id="pin" type="password" class="w" placeholder="PIN" autocomplete="current-password"><p class="mute">'+(msg||'PIN yang sama dengan di Code.gs.')+'</p><button class="save" onclick="enter()">Masuk</button></div>'}
function enter(){var v=document.getElementById('pin').value.trim();if(!v)return;PIN=v;lss(KP,v);loading=!S.accounts.length;render();start()}
function logout(){PIN='';lss(KP,'');lock()}
function boot(){
 PIN=lsg(KP)||'';var c=lsg(KC);try{S=c?Object.assign(emptyS(),JSON.parse(c)):emptyS()}catch(e){S=emptyS()}
 try{Q=JSON.parse(lsg(KQ)||'[]')}catch(e){Q=[]}
 F=freshF();loading=!c;
 document.addEventListener('visibilitychange',function(){if(!document.hidden&&PIN)start()});
 window.addEventListener('online',function(){if(PIN)start()});
 if(!PIN){render();lock();return}
 render();start()}
function flow(id,t0,t1){var c=0,d=0;S.tx.forEach(function(t){if(t.t<t0||t.t>=t1)return;if(t.type==='in'&&t.acc===id)c+=t.amt;if(t.type==='out'&&t.acc===id)d+=t.amt;if(t.type==='tf'){if(t.acc===id)d+=t.amt;if(t.to===id)c+=t.amt}});return[c,d]}
function bal(id){var a=S.accounts.filter(function(x){return x.id===id})[0],f=flow(id,0,9e15);return(a?a.init:0)+f[0]-f[1]}
function pb(p){return(+p.init||0)+sum(S.tx,function(t){return t.al&&t.al[p.id]||0})}
function pocks(){var tot=sum(S.accounts,function(a){return bal(a.id)}),pk=sum(S.pockets,pb);return{tot:tot,pk:pk,bisa:tot-pk}}
function dl(){var n=new Date(),p=+S.payday||25,nx=new Date(n.getFullYear(),n.getMonth(),p);if(n.getDate()>=p)nx=new Date(n.getFullYear(),n.getMonth()+1,p);return Math.max(1,Math.ceil((nx-ds(n))/864e5))}

function render(){
 var N=[['home','Beranda'],['catat','Catat'],['hist','Riwayat'],['ins','Insight'],['rek','Rekap'],['set','Atur']];
 document.getElementById('nav').innerHTML=N.map(function(n){return'<button class="'+(view===n[0]?'on':'')+'" onclick="go(\''+n[0]+'\')">'+n[1]+'</button>'}).join('');
 var v=loading?'<p class="mute">Memuat data dari Google Sheets...</p>':{home:vHome,catat:vCatat,hist:vHist,ins:vIns,rek:vRek,set:vSet}[view]();
 document.getElementById('app').innerHTML=v}
function go(v){view=v;delId=null;render();window.scrollTo(0,0)}
function toast(s){var e=document.createElement('div');e.className='toast';e.textContent=s;document.body.appendChild(e);setTimeout(function(){e.remove()},1800)}

function vHome(){
 var p=pocks(),d=dl(),ts=ds(Date.now()),st=sum(S.tx.filter(function(t){return t.type==='out'&&t.t>=ts}),function(t){return t.amt});
 var bd=Math.max(0,(p.bisa+st)/d),left=bd-st,pc=bd>0?Math.min(100,st/bd*100):100;
 var h='<div class="grid"><div><div class="card hero"><div class="mute" style="color:var(--ink)">Sisa jatah hari ini</div><div class="big">'+rp(Math.max(left,0))+'</div><div style="font-size:13px">'+(left>=0?'Masih aman untuk hari ini.':'Lewat '+rp(-left)+' dari jatah. Jatah hari berikutnya otomatis menyesuaikan.')+'</div><div class="chk" style="margin:12px 0 6px;background:linear-gradient(90deg,var(--ink) '+pc+'%,#fff '+pc+'%)"></div><div class="mute" style="color:var(--ink)">Jatah '+rp(bd)+'/hari &middot; gajian '+d+' hari lagi</div></div>';
 h+='<h2>Pocket</h2><div class="card"><div class="row pk"><span><b class="d" style="background:#BDE8D6"></b>Uang bisa dipakai</span><b>'+rp(p.bisa)+'</b></div>'+S.pockets.map(function(q,i){var v=pb(q),pr=q.target?Math.min(100,v/q.target*100):0;return'<div class="row pk" style="flex-wrap:wrap"><span><b class="d" style="background:'+PAL[(i+3)%8]+'"></b>'+esc(q.name)+'</span><b>'+rp(v)+'</b>'+(q.target?'<div style="width:100%;display:flex;gap:8px;align-items:center"><div class="bar"><i style="width:'+pr+'%;background:'+PAL[(i+3)%8]+'"></i></div><span class="tag">target '+kk(q.target)+'</span></div>':'')+'</div>'}).join('')+'</div></div>';
 h+='<div><h2>Saldo account</h2><div class="card">'+S.accounts.map(function(a){return'<div class="row"><span>'+esc(a.name)+'</span><b>'+rp(bal(a.id))+'</b></div>'}).join('')+'<div class="row" style="border-top:2px solid var(--ink)"><b>Total semua account</b><b>'+rp(p.tot)+'</b></div></div>';
 h+='<h2>Terakhir dicatat</h2><div class="card scroll">'+tbl(S.tx.slice().sort(function(a,b){return b.t-a.t}).slice(0,5),0)+'</div></div></div>';
 return h}

function face(i){var c=PAL[i%8],m=['M8 16q4-4 8 0','M8 15h8','M8 15q4 1 8 0','M7 13q5 6 10 0','M10 14a2 2 0 1 0 4 0a2 2 0 1 0-4 0','M8 14q4 2 8 0'][i%6];return'<svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="'+c+'" stroke="#1D1B2E" stroke-width="1.5"/><circle cx="9" cy="10" r="1.1" fill="#1D1B2E"/><circle cx="15" cy="10" r="1.1" fill="#1D1B2E"/><path d="'+m+'" fill="none" stroke="#1D1B2E" stroke-width="1.5" stroke-linecap="round"/></svg>'}
function ch(l,on,js,x){return'<button class="chip'+(on?' on':'')+'" onclick="'+js+'">'+(x||'')+esc(l)+'</button>'}
function freshF(t){var l=S.tx.filter(function(x){return x.type==='out'}).slice(-1)[0];return{type:t||'out',amt:'',cat:'',inc:S.incs[0],acc:l?l.acc:(S.accounts[0]||{}).id,to:((S.accounts[1]||S.accounts[0])||{}).id,pk:(S.pockets[0]||{}).id,mood:'',note:'',date:ymd(Date.now())}}
function vCatat(){
 var t=F.type,s='<div class="seg">'+['out','in','tf','sv'].map(function(x){return'<button class="'+(t===x?'on':'')+'" onclick="F.type=\''+x+'\';render()">'+TN[x]+'</button>'}).join('')+'</div>';
 s+='<div style="max-width:560px"><div class="amt">Rp<input id="amt" inputmode="numeric" placeholder="0" value="'+(F.amt?nf(F.amt):'')+'" oninput="F.amt=num(this.value);this.value=F.amt?nf(F.amt):\'\'"></div><div class="chips" style="margin-top:0">'+[20000,50000,100000].map(function(v){return ch('+'+kk(v),0,'qa('+v+')')}).join('')+'</div>';
 var A=function(k){return S.accounts.map(function(a,i){return ch(a.name,F[k]===a.id,'F.'+k+'=S.accounts['+i+'].id;render()')}).join('')};
 if(t==='out')s+='<label>Untuk apa?</label><div class="chips">'+S.cats.map(function(c,i){return ch(c,F.cat===c,'F.cat=S.cats['+i+'];render()')}).join('')+'</div><label>Bayar pakai apa?</label><div class="chips">'+A('acc')+'</div><label>Emotion</label><div class="chips">'+S.moods.map(function(c,i){return ch(c,F.mood===c,'F.mood=F.mood===S.moods['+i+']?\'\':S.moods['+i+'];render()',face(i))}).join('')+'</div>';
 if(t==='in')s+='<label>Dari mana?</label><div class="chips">'+S.incs.map(function(c,i){return ch(c,F.inc===c,'F.inc=S.incs['+i+'];render()')}).join('')+'</div><label>Masuk ke</label><div class="chips">'+A('acc')+'</div><p class="mute">'+(F.inc===S.incs[0]?'Otomatis dibagi ke pocket: '+S.pockets.map(function(p){return esc(p.name)+' '+p.pct+'%'}).join(', ')+'. Sisanya jadi uang bisa dipakai.':'Langsung jadi uang bisa dipakai.')+'</p>';
 if(t==='tf')s+='<label>Dari</label><div class="chips">'+A('acc')+'</div><label>Ke</label><div class="chips">'+A('to')+'</div>';
 if(t==='sv')s+='<label>Ke pocket mana?</label><div class="chips">'+S.pockets.map(function(p,i){return ch(p.name,F.pk===p.id,'F.pk=S.pockets['+i+'].id;render()')}).join('')+'</div><p class="mute">Uang bisa dipakai sekarang '+rp(pocks().bisa)+'. Nabung memindahkan sebagian ke pocket, saldo account tidak berubah.</p>';
 s+='<label>Tanggal</label><input type="date" value="'+F.date+'" onchange="F.date=this.value"><label>Catatan</label><input class="w" placeholder="Catatan (boleh kosong)" value="'+esc(F.note)+'" oninput="F.note=this.value"><div style="height:14px"></div><button class="save" onclick="saveTx()">Simpan</button></div>';
 return s}
function qa(v){F.amt=(+F.amt||0)+v;render()}
function saveTx(){
 var a=+F.amt,t=F.type;if(!a)return toast('Isi nominalnya dulu');
 if(t==='out'&&!F.cat)return toast('Pilih kategorinya dulu');
 if(t==='tf'&&F.acc===F.to)return toast('Pilih dua account yang berbeda');
 if(t==='sv'&&!F.pk)return toast('Belum ada pocket, tambah di Atur');
 var dt=F.date||ymd(Date.now()),n=new Date(),p=dt.split('-'),tm=dt===ymd(n)?new Date(+p[0],p[1]-1,+p[2],n.getHours(),n.getMinutes()).getTime():new Date(+p[0],p[1]-1,+p[2],12,0).getTime();

 var T=[0,0,0,0];S.accounts.forEach(function(a){var f0=flow(a.id,0,t0),aw=(+a.init||0)+f0[0]-f0[1],f=flow(a.id,t0,t1),ak=aw+f[0]-f[1];T[0]+=aw;T[1]+=f[0];T[2]+=f[1];T[3]+=ak;h+='<tr><td>'+esc(a.name)+'</td><td>'+mc(aw)+'</td><td style="color:#2f7d5b">'+mc(f[0])+'</td><td>'+mc(f[1])+'</td><td><b>'+mc(ak)+'</b></td></tr>'});
